# ============================================
# CD Pipeline - Deploy to AWS EKS
# Triggers on push to main (after CI passes)
# ============================================
name: CD Pipeline - Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: prakruthi-eks
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ============================================
  # Build & Push Docker Images to ECR
  # ============================================
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, admin]
        include:
          - service: api
            dockerfile: services/api/Dockerfile
            ecr_repo: prakruthi/api
          - service: web
            dockerfile: apps/web/Dockerfile
            ecr_repo: prakruthi/web
          - service: admin
            dockerfile: apps/admin/Dockerfile
            ecr_repo: prakruthi/admin
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://32.197.221.45:30400

# ============================================
# DEPLOY TO K3S (REPLACES EKS COMPLETELY)
# ============================================
  deploy:
    name: Deploy to K3S
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- SSH SETUP ----------------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      # ---------------- DEPLOY ----------------
      - name: Deploy to K3S server
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@${{ env.K3S_SERVER }} << 'EOF'

          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          echo "🚀 Applying Kubernetes manifests..."

          kubectl apply -f /home/ubuntu/k8s/namespace.yaml
          kubectl apply -f /home/ubuntu/k8s/secrets-configmap.yaml

          kubectl apply -f /home/ubuntu/k8s/api-deployment.yaml
          kubectl apply -f /home/ubuntu/k8s/web-deployment.yaml
          kubectl apply -f /home/ubuntu/k8s/admin-deployment.yaml

          kubectl apply -f /home/ubuntu/k8s/services.yaml
          kubectl apply -f /home/ubuntu/k8s/ingress.yaml

          echo "⏳ Waiting for rollout..."

          kubectl rollout status deployment/prakruthi-api -n prakruthi --timeout=300s || true
          kubectl rollout status deployment/prakruthi-web -n prakruthi --timeout=300s || true
          kubectl rollout status deployment/prakruthi-admin -n prakruthi --timeout=300s || true

          echo "📦 Pod Status:"
          kubectl get pods -n prakruthi

          echo "🌐 Service Status:"
          kubectl get svc -n prakruthi

          echo "🎯 Ingress:"
          kubectl get ingress -n prakruthi

          EOF

# ============================================
# HEALTH CHECK (K3S VERSION)
# ============================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check API
        run: |
          echo "Checking API health..."

          curl -sf http://${{ env.K3S_SERVER }}:30400/health || echo "NodePort not ready"

          curl -sf http://${{ env.K3S_SERVER }}/health || echo "Ingress not ready"
  # ============================================
  # Post-Deploy Notifications
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Notify on success
        if: needs.deploy.result == 'success'
        run: echo "Deployment successful! 🚀"

      - name: Notify on failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "Deployment failed! Check logs."
          exit 1
