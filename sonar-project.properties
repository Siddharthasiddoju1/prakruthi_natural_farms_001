# SonarQube Configuration
# ============================================

sonar.projectKey=prakruthi-natural-farms
sonar.projectName=Prakruthi Natural Farms
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=apps/web/src,apps/admin/src,services/api/src,packages/shared/src

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/migrations/**

# Test directories
sonar.tests=services/api/src/**/*.test.ts,apps/web/src/**/*.test.tsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript/JavaScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Coverage exclusions
sonar.coverage.exclusions=**/migrations/**,**/scripts/**,**/seed.ts,**/*.d.ts
