apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prakruthi-ingress
  namespace: prakruthi
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:ACCOUNT_ID:certificate/CERT_ID"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/group.name: "prakruthi"
spec:
  rules:
    # Main web application
    - host: prakruthi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prakruthi-web-service
                port:
                  number: 80

    - host: www.prakruthi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prakruthi-web-service
                port:
                  number: 80

    # API
    - host: api.prakruthi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prakruthi-api-service
                port:
                  number: 80

    # Admin panel
    - host: admin.prakruthi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prakruthi-admin-service
                port:
                  number: 80
