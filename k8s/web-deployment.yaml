apiVersion: apps/v1
kind: Deployment
metadata:
  name: prakruthi-web
  namespace: prakruthi
  labels:
    app: prakruthi-web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prakruthi-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: prakruthi-web
        tier: frontend
    spec:
      containers:
        - name: web
          image: 266579819838.dkr.ecr.ap-south-1.amazonaws.com/prakruthi/web:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: prakruthi-web-service
  namespace: prakruthi
  labels:
    app: prakruthi-web
spec:
  type: ClusterIP
  selector:
    app: prakruthi-web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
