apiVersion: apps/v1
kind: Deployment
metadata:
  name: prakruthi-api
  namespace: prakruthi
  labels:
    app: prakruthi-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prakruthi-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: prakruthi-api
        tier: backend
    spec:
      containers:
        - name: api
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/prakruthi/api:latest
          ports:
            - containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: prakruthi-secrets
            - configMapRef:
                name: prakruthi-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: prakruthi-api-service
  namespace: prakruthi
  labels:
    app: prakruthi-api
spec:
  type: ClusterIP
  selector:
    app: prakruthi-api
  ports:
    - port: 80
      targetPort: 4000
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prakruthi-api-hpa
  namespace: prakruthi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prakruthi-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
