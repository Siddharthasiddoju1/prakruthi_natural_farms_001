apiVersion: batch/v1
kind: Job
metadata:
  name: prakruthi-db-migrate
  namespace: prakruthi
  labels:
    app: prakruthi-api
    job: db-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: migrate
          image: 266579819838.dkr.ecr.ap-south-1.amazonaws.com/prakruthi/api:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: prakruthi-secrets
            - configMapRef:
                name: prakruthi-config
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: prakruthi-db-seed
  namespace: prakruthi
  labels:
    app: prakruthi-api
    job: db-seed
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
        - name: seed
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/prakruthi/api:latest
          command: ["node", "dist/scripts/seed.js"]
          envFrom:
            - secretRef:
                name: prakruthi-secrets
            - configMapRef:
                name: prakruthi-config
      restartPolicy: Never
