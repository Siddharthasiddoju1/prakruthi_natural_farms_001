apiVersion: v1
kind: Secret
metadata:
  name: prakruthi-secrets
  namespace: prakruthi
type: Opaque
stringData:
  DATABASE_URL: "postgresql://prakruthi_admin:CHANGE_ME@prakruthi-db-endpoint:5432/prakruthi_db"
  JWT_SECRET: "CHANGE_ME_TO_STRONG_SECRET"
  OTP_PROVIDER: "twilio"
  OTP_API_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prakruthi-config
  namespace: prakruthi
data:
  NODE_ENV: "production"
  PORT: "4000"
  CORS_ORIGIN: "https://prakruthi.com,https://admin.prakruthi.com"
  LOG_LEVEL: "info"
