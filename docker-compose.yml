version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: prakruthi-db
    environment:
      POSTGRES_USER: prakruthi
      POSTGRES_PASSWORD: prakruthi_dev_pass
      POSTGRES_DB: prakruthi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prakruthi -d prakruthi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prakruthi-network

  # ============================================
  # API Service
  # ============================================
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: prakruthi-api
    environment:
      DATABASE_URL: postgresql://prakruthi:prakruthi_dev_pass@db:5432/prakruthi_db
      JWT_SECRET: dev-jwt-secret-change-in-production
      PORT: "4000"
      NODE_ENV: development
      OTP_PROVIDER: mock
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prakruthi-network
    restart: unless-stopped

  # ============================================
  # Web Frontend
  # ============================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    container_name: prakruthi-web
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - prakruthi-network
    restart: unless-stopped

  # ============================================
  # Admin Frontend
  # ============================================
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    container_name: prakruthi-admin
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - prakruthi-network
    restart: unless-stopped

  # ============================================
  # SonarQube (Code Quality)
  # ============================================
  sonarqube:
    image: sonarqube:lts-community
    container_name: prakruthi-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - prakruthi-network

volumes:
  pgdata:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  prakruthi-network:
    driver: bridge
